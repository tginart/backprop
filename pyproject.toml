[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "backprop-foundry"
version = "0.1.2"
readme = "README.md"
license = "Apache-2.0"
description = "Foundry-native experiment logging with a W&B-shaped Python API"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.12,<3"]
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md", "licenses/Weave-Apache-2.0.txt"]

[project.optional-dependencies]
stats = ["psutil>=5.9"]
gpu = ["psutil>=5.9", "nvidia-ml-py>=12"]
torch = ["torch>=2.14.1"]
tensorboard = ["tensorboard>=2.15,<3"]
keras = ["tensorflow>=2.18,<2.19", "keras>=3.15.1,<4", "protobuf>=5.29.6,<6"]
lightning = ["lightning>=2.6.6,<3", "fsspec>=2026.7.0", "torch>=2.14.1"]
xgboost = ["xgboost>=2,<4"]
lightgbm = ["lightgbm>=4.7,<5"]
catboost = ["catboost>=1.2,<2"]
gym = ["gymnasium>=1.0,<1.1", "moviepy==1.0.3", "numpy>=1.26,<2", "Pillow>=12.3", "imageio-ffmpeg"]
sb3 = ["stable-baselines3>=2.4,<3", "torch>=2.14.1", "Pillow>=12.3"]
fastai = ["fastai>=1.0.61,<2"]
media = ["numpy", "Pillow>=12.3"]
video = ["numpy>=1.26,<2", "Pillow>=12.3", "moviepy==1.0.3", "imageio>=2.28.1", "packaging"]
plots = ["numpy", "pandas", "scikit-learn>=1.5,<2", "matplotlib", "plotly", "Pillow>=12.3"]
dataframes = ["pandas", "polars", "pyarrow"]
config = ["PyYAML"]
query = ["google-re2"]
checksums = ["xxhash"]
references = ["requests>=2.34.2", "urllib3>=2.8", "certifi>=2026.7.22"]
aws = ["boto3"]
gcp = ["google-cloud-storage>=3,<4", "google-auth[requests]>=2,<3"]
azure = ["azure-storage-blob", "azure-identity"]

[project.scripts]
backprop = "backprop.__main__:main"

[tool.setuptools.package-data]
backprop = ["integration/upstream-sources.json"]

[project.urls]
Homepage = "https://github.com/tginart/backprop"
Repository = "https://github.com/tginart/backprop"
Issues = "https://github.com/tginart/backprop/issues"
Security = "https://github.com/tginart/backprop/security"
